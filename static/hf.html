  <script>
  /* Inline ON PURPOSE, and it must stay inline. Every other line of this app
     arrives over its own HTTP request; when one of those never lands, nothing
     runs — no router, no readiness flag, no error handler — and the page shows
     its empty shell forever. This is the only code that is already here.

     Two failures it names. A <script>/<link> that fails outright reports itself
     at once. A load that merely never finishes has nothing to report, so a
     timer settles it: still "loading" after 20s means the boot did not happen.
     Either way data-t-state reaches "error", which is what the contract in
     docs/testability.md promises and could not previously deliver — the code
     that would have set it was the code that failed to arrive. */
  (function () {
    var dead = [], done = false;
    addEventListener("error", function (e) {
      var el = e.target;
      if (el && (el.tagName === "SCRIPT" || el.tagName === "LINK")) {
        dead.push((el.src || el.href || "").replace(location.origin, ""));
        if (/\/js\/main\.js/.test(el.src || "")) fail();
      }
    }, true);
    function fail() {
      if (done || document.body.dataset.tState !== "loading") return;
      done = true;
      var why = dead.length ? "assets did not load: " + dead.join(", ")
                            : "scripts did not initialise";
      document.body.dataset.tState = "error";
      document.body.dataset.tStateDetail = why;
      document.body.setAttribute("aria-busy", "false");
      var b = document.createElement("div");
      b.setAttribute("role", "alert");
      b.setAttribute("data-t", "boot-error");
      b.style.cssText = "position:fixed;inset:0 0 auto 0;z-index:99999;padding:14px 18px;"
        + "background:#3b1d1d;color:#fca5a5;border-bottom:1px solid #7f1d1d;"
        + "font:13px/1.5 ui-monospace,monospace";
      b.textContent = "This page did not finish loading — " + why + ". ";
      var r = document.createElement("button");
      r.textContent = "Reload";
      r.style.cssText = "margin-left:10px;padding:3px 10px;cursor:pointer;"
        + "background:#7f1d1d;color:#fee2e2;border:1px solid #b91c1c;border-radius:4px";
      r.onclick = function () { location.reload(); };
      b.appendChild(r);
      document.body.appendChild(b);
    }
    setTimeout(fail, 20000);
  })();

    <script>
      (() => {
        const l = document.getElementById("appLoader");
        // caption — in the saved interface language (English by default)
        const lang = (localStorage.getItem("llamacppAdminLang") || "en").toLowerCase();
        const hints = { en: "loading…", ru: "загружается…", zh: "加载中…", es: "cargando…",
          fr: "chargement…", de: "lädt…", ja: "読み込み中…", pt: "carregando…", it: "caricamento…",
          ko: "로딩 중…", tr: "yükleniyor…", vi: "đang tải…", hi: "लोड हो रहा है…", ar: "جارٍ التحميل…",
          bn: "লোড হচ্ছে…", id: "memuat…", ur: "لوڈ ہو رہا ہے…", te: "లోడ్ అవుతోంది…",
          mr: "लोड होत आहे…", ta: "ஏற்றுகிறது…" };
        l.querySelector(".pl-hint").textContent = hints[lang] || hints.en;
        // random caravan: cargo shape × body color × blanket × cargo color —
        // shapes come from a pixel grid (.pl-s1..s4), colors are mixed via variables;
        // a 1/10 chance one spot in the caravan is a turtle instead
        const BODIES = ["#d9c29a", "#e8e2d4", "#a97e4f", "#b9b3a7", "#8a6f52", "#cbb188"];
        const BLANKETS = ["#43b3a4", "#d98c4a", "#9a7bd0", "#c4574e", "#4f8fd0", "#c9a83b", null];
        const CARGOS = ["#6e5137", "#8a7351", "#5d6657", "#7a4a41"];
        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const walkers = l.querySelectorAll(".pl-llama");
        const turtleAt = Math.random() < 0.1 ? Math.floor(Math.random() * walkers.length) : -1;
        walkers.forEach((el, i) => {
          if (i === turtleAt) {
            el.classList.add("pl-t");
            if (Math.random() < 0.5) el.classList.add("pl-t-hop");
            return;
          }
          el.classList.add("pl-s" + (1 + Math.floor(Math.random() * 4)));
          const body = pick(BODIES);
          el.style.setProperty("--pl-body", body);
          const blanket = pick(BLANKETS);
          el.style.setProperty("--pl-blanket", blanket || body);
          el.style.setProperty("--pl-cargo", pick(CARGOS));
          el.style.setProperty("--pl-rope", "#c8a06c");
        });
        // 2-frame walk cycle
        const gait = setInterval(() => l && l.querySelectorAll(".pl-llama").forEach(el => el.classList.toggle("pl-gaitb")), 220);
        window.__plHide = () => { if (!l || l.classList.contains("pl-done")) return; l.classList.add("pl-done");
          setTimeout(() => { clearInterval(gait); l.remove(); }, 400); };
        // easter eggs: click a llama to make it hop; click a turtle for 2s of the egyptian walk
        l.querySelector(".pl-strip").addEventListener("click", (ev) => {
          const el = ev.target.closest(".pl-llama");
          if (!el) return;
          if (el.classList.contains("pl-t")) {
            if (el.classList.contains("pl-egypt")) return;
            const hopped = el.classList.contains("pl-t-hop");
            el.classList.remove("pl-t-hop");
            el.classList.add("pl-egypt");
            setTimeout(() => { el.classList.remove("pl-egypt"); if (hopped) el.classList.add("pl-t-hop"); }, 2000);
            return;
          }
          if (el.classList.contains("pl-jump")) return;
          el.classList.add("pl-jump");
          el.addEventListener("animationend", () => el.classList.remove("pl-jump"), { once: true });
        });
        setTimeout(window.__plHide, 20000);  // safety net in case init hangs
      })();
    </script>

      </div>
      <button type="button" class="ob-btn-head" data-ob-tour>
        <span class="ob-q">?</span><span id="obBtnLabel">Tour</span>
      </button>
      <div class="lang-select" id="langSelect">
        <button id="langTrigger" class="lang-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"
                aria-label="Interface language" data-t="header-lang-open">
          <span class="lang-emoji" id="langTriggerEmoji">☕</span><span class="lang-code" id="langTriggerCode" data-t="header-lang-current">EN</span><span class="lang-caret" aria-hidden="true">▾</span>
        </button>
        <ul class="lang-menu" id="langMenu" role="listbox" tabindex="-1" hidden aria-label="Interface language" data-t="header-lang-menu"></ul>
      </div>
    </div>
  </header>

  <main class="hfp" id="hfPage">
    <section class="hfp-side">
      <div class="hfp-filters" id="hfFilters">
        <form class="hfp-search" id="hfSearchForm" role="search">
          <input id="hfSearchInput" data-t="hf-search-input" type="search" autocomplete="off" spellcheck="false"
                 placeholder="author/repo or search words…" aria-label="Search Hugging Face">
          <select id="hfLimitSelect" data-t="hf-limit" aria-label="Number of results">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
          </select>
          <button id="hfSearchBtn" data-t="hf-search-submit" type="submit" class="hfp-btn is-primary">Search</button>
        </form>
        <div class="hfp-chips" id="hfSizeChips" role="group" aria-label="Model size"></div>
        <div class="hfp-chips" id="hfCapChips" role="group" aria-label="Capabilities" hidden></div>
        <div class="hfp-line">
          <input id="hfMaskInput" data-t="hf-mask" type="search" autocomplete="off" spellcheck="false" placeholder="name contains…" aria-label="Filter by file name">
          <select id="hfSortSelect" data-t="hf-sort" aria-label="Sort order"></select>
          <button id="hfSortDir" data-t="hf-sort-dir" type="button" class="hfp-btn">↓</button>
        </div>
        <div class="hfp-line">
          <div class="hfp-load" id="hfLoad" data-t="hf-load-progress" hidden>
            <span id="hfLoadText"></span><span class="hfp-bar"><i id="hfLoadFill"></i></span>
          </div>
          <span class="grow"></span>
          <div class="hfp-token" id="hfToken">
            <button id="hfTokenBtn" data-t="hf-token-menu" type="button" class="hfp-link" aria-haspopup="dialog" aria-expanded="false">
              <span class="hfp-token-label">HF token</span> <span id="hfTokenStatus">checking…</span> ▾
            </button>
            <div class="hfp-token-pop" id="hfTokenPop" hidden>
              <div id="hfTokenText"></div>
              <input id="hfTokenInput" data-t="hf-token-input" type="password" placeholder="hf_…" autocomplete="off" spellcheck="false" hidden>
              <div class="hfp-line">
                <button id="hfTokenSaveBtn" data-t="hf-token-save" type="button" class="hfp-btn is-primary" hidden>Save</button>
                <button id="hfTokenEditBtn" data-t="hf-token-edit" type="button" class="hfp-btn">Change</button>
                <button id="hfTokenClearBtn" data-t="hf-token-clear" type="button" class="hfp-btn" hidden>Clear</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="hfp-tabs" id="hfTabs" role="tablist">
        <button id="hfTabResults" data-t="hf-tab" data-t-id="results" data-tab="results" type="button" role="tab" aria-selected="true" class="is-on">Results</button>
        <button id="hfTabFavs" data-t="hf-tab" data-t-id="favorites" data-tab="favorites" type="button" role="tab" aria-selected="false">★ Favorites</button>
      </div>
      <div class="hfp-listhead" id="hfListHead"></div>
      <div class="hfp-list" id="hfList"></div>
    </section>
    <section class="hfp-repo" id="hfRepo" data-t="hf-repo" aria-live="polite"></section>
    <div class="hfp-dock" id="hfDock" data-t="hf-dock" hidden></div>
  </main>
  <div class="hfp-frontier" id="hfFrontier" data-t="hf-frontier" role="dialog" hidden></div>

  <script type="module" src="/js/hf-page.js"></script>
</body>
</html>
