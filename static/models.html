<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Models — Lama Caravan</title>
  <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/topology-board.css">
  <link rel="stylesheet" href="/css/canvas.css">
  <link rel="stylesheet" href="/css/modals.css">
  <link rel="stylesheet" href="/css/cards.css">
  <link rel="stylesheet" href="/css/form.css">
  <link rel="stylesheet" href="/css/monitor.css">
  <link rel="stylesheet" href="/css/nodes.css">
  <link rel="stylesheet" href="/css/onboarding.css">
  <style>
    body {
      min-height: 100dvh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui, system-ui, sans-serif);
      display: flex;
      flex-direction: column;
    }
    .topbar { position: sticky; top: 0; z-index: 30; }

    /* Two colours of their own on this page: the library's lilac and the
       blue of bytes on their way. Every 📚 and every ⇢ below wears them. */
    .mdl-wrap {
      --lib: #b39ddb;
      --move: #4fc3f7;
      --faint: color-mix(in srgb, var(--muted) 72%, var(--bg));
      --line-soft: color-mix(in srgb, var(--line) 70%, var(--surface));
      width: min(1320px, calc(100% - 32px));
      margin: 0 auto;
      padding: 20px 0 64px;
      display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 16px; align-items: start;
      flex: 1;
    }
    @media (max-width: 900px) { .mdl-wrap { grid-template-columns: minmax(0, 1fr); } }
    /* The app's forms make every input a full-width 42px field and every
       checkbox 22px; on this page they sit inside rows of text. */
    .mdl-wrap input[type=checkbox] { width: 14px; height: 14px; min-height: 14px; margin: 0; flex: none; accent-color: var(--accent); }
    /* …and every button 34px tall, which in a 36px row is a row of buttons. */
    .mdl-wrap button { min-height: 0; }

    /* ── The side: where to look, what to show, Hugging Face ────────────── */
    /* It stays in view while the list scrolls: the places and the filters
       are how the list is steered, and a steering wheel scrolled off the
       screen is one nobody reaches for. */
    .mdl-side {
      position: sticky; top: 72px; max-height: calc(100dvh - 88px); overflow: auto;
      display: grid; gap: 18px; padding: 12px 8px;
      border: 1px solid var(--line); border-radius: 16px; background: var(--surface);
    }
    @media (max-width: 900px) { .mdl-side { position: static; max-height: none; } }
    .mdl-side-h {
      margin: 0 0 6px 10px; font-size: 10.5px; font-weight: 600; letter-spacing: .1em;
      text-transform: uppercase; color: var(--faint);
    }
    .mdl-nav { display: grid; gap: 3px; }
    .mdl-place, .mdl-filter {
      display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; column-gap: 8px; row-gap: 5px; align-items: center;
      width: 100%; padding: 8px 10px; border: 0; border-radius: 10px; background: transparent;
      color: var(--text); font: inherit; font-size: 13px; text-align: left; cursor: pointer;
    }
    .mdl-place:hover, .mdl-filter:hover:not(:disabled) { background: color-mix(in srgb, var(--line) 35%, transparent); }
    .mdl-place:focus-visible, .mdl-filter:focus-visible, .mdl-open:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 1px; }
    .mdl-place[aria-current="true"], .mdl-filter[aria-pressed="true"] {
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent);
    }
    .mdl-place .nm { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .mdl-place .nm > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mdl-place .c, .mdl-filter .c { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .mdl-place .mdl-store-bar, .mdl-place .sub { grid-column: 2 / 4; }
    .mdl-place .mdl-store-bar { width: auto; height: 4px; }
    .mdl-place .sub { margin-top: -2px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .mdl-place.add { grid-template-columns: 20px minmax(0, 1fr); color: var(--muted); border: 1px dashed var(--line); }
    .mdl-filter:disabled { opacity: .45; cursor: default; }
    .mdl-filter .c.warn { color: var(--warn); }
    .mdl-filter .c.mv { color: var(--move); }
    /* The side column is narrow: the path gets a line of its own, the
       buttons go under it. */
    .mdl-store-add { flex-wrap: wrap; padding: 4px 4px 0; }
    .mdl-path-edit.mdl-store-add input { flex: 1 1 100%; }
    /* A healthy store is a green dot in the list — its word is still there
       for a screen reader and a test, just not printed beside every name; a
       store that is NOT fine says so in words. */
    .mdl-place .mdl-store-state.good {
      width: 7px; height: 7px; padding: 0; border: 0; border-radius: 50%;
      background: currentColor; font-size: 0; flex: none;
    }
    .mdl-hf { display: grid; gap: 9px; padding: 14px 10px 4px; border-top: 1px solid var(--line-soft); font-size: 12px; color: var(--muted); }
    .mdl-hf .mdl-side-h { margin: 0; }
    .mdl-fresh-row { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; }
    .mdl-fresh-auto { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    .mdl-fresh-at {
      width: auto; height: 26px; background: transparent; color: var(--text); font-size: 12px;
      border: 1px solid color-mix(in srgb, currentColor 28%, transparent);
      border-radius: 6px; padding: 1px 6px;
    }
    .mdl-fresh-at:disabled { opacity: 0.45; }
    /* The timestamp is required: a report without one reads as "just
       checked", and yesterday's "everything matches" looks like today's. */
    .mdl-fresh-stamp { color: var(--text); }
    .mdl-hf-check {
      justify-self: start; padding: 5px 12px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 12px;
      border: 1px solid var(--line); background: var(--button-bg, #151f23); color: var(--text);
    }
    .mdl-hf-check:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
    .mdl-hf-check:disabled { opacity: .6; cursor: default; }

    /* ── The main column ───────────────────────────────────────────────── */
    /* clip, not hidden: hidden would make this box the scroller, and the
       selection bar below could no longer stick to the bottom of the
       window. */
    .mdl-main {
      min-width: 0; display: flex; flex-direction: column; overflow: clip;
      border: 1px solid var(--line); border-radius: 16px; background: var(--surface);
    }

    /* The summary over the list says what the chosen place holds and how
       much room it has left. */
    .mdl-sum { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; padding: 16px; border-bottom: 1px solid var(--line); }
    .mdl-sum-main { flex: 1 1 320px; display: grid; gap: 10px; min-width: 0; }
    .mdl-sum-title { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; margin: 0; font-size: 17px; font-weight: 700; }
    .mdl-sum-title .facts { font-size: 13px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
    .mdl-sum-line { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; min-width: 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .mdl-sum-line .mdl-store-path { max-width: 60ch; }
    .mdl-sum-line .mdl-path-edit { flex: 1 1 420px; }
    /* Where the models are, as one bar: a segment per place, as long as
       what that place holds. */
    .mdl-stack { display: grid; gap: 6px; }
    .mdl-stack-bars { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: color-mix(in srgb, var(--line) 85%, transparent); }
    .mdl-stack-bars i { display: block; height: 100%; }
    .mdl-stack-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .mdl-stack-legend b { color: var(--text); font-weight: 600; }
    .mdl-sw { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; }
    .mdl-stack .here { background: color-mix(in srgb, var(--accent) 80%, var(--muted)); }
    .mdl-stack .lib0 { background: color-mix(in srgb, var(--lib) 80%, var(--muted)); }
    .mdl-stack .lib1 { background: color-mix(in srgb, var(--lib) 50%, var(--move)); }
    .mdl-stack .lib2 { background: color-mix(in srgb, var(--lib) 45%, var(--bg)); }
    .mdl-cards { flex: 0 1 auto; display: flex; flex-wrap: wrap; gap: 10px; }
    .mdl-card {
      width: 230px; display: grid; gap: 7px; padding: 10px 12px; border-radius: 12px;
      border: 1px solid var(--line-soft); background: color-mix(in srgb, var(--bg) 55%, transparent);
    }
    .mdl-card-h { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 12.5px; font-weight: 650; }
    .mdl-card-h .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mdl-card .mdl-store-bar { width: auto; height: 5px; }
    .mdl-card .mdl-full { font-size: 11.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
    .mdl-open { padding: 0; border: 0; background: transparent; color: var(--accent-strong); font: inherit; font-size: 11.5px; cursor: pointer; white-space: nowrap; }
    .mdl-open:hover { text-decoration: underline; }
    .mdl-free { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
    .mdl-free b { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
    .mdl-free span { font-size: 11.5px; color: var(--muted); }
    .mdl-sum-space { flex: 0 1 300px; display: grid; gap: 8px; min-width: 240px; }
    .mdl-sum-space .mdl-free { justify-content: flex-end; }
    .mdl-sum-space .mdl-free b { font-size: 24px; letter-spacing: -.02em; }
    .mdl-sum-space .mdl-store-bar { width: auto; height: 6px; }
    .mdl-sum-space .mdl-full { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

    /* The line over the list: how much lies unused and the button that picks
       exactly those, everything on its way, and the name filter. */
    .mdl-strip { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; color: var(--muted); }
    .mdl-strip .mini-link { margin-left: 0; }
    .mdl-strip-gap { flex: 1 1 auto; }
    .mdl-unused { color: var(--muted); }
    .mdl-unused.warn { color: var(--warn); font-weight: 600; }
    .mdl-search {
      width: 220px; max-width: 100%; height: 30px; padding: 0 12px; border-radius: 9px;
      border: 1px solid var(--line); background: var(--field); color: var(--text);
      font: 12px ui-monospace, Menlo, monospace;
    }
    .mdl-search:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 1px; }

    /* ── The list: one grid, so every size sits under its own header ────── */
    /* Nesting is indentation INSIDE the name cell, never a margin on the
       branch: a nested box a few pixels narrower would shift every column of
       its rows off the header's. */
    .mdl-tree { --cols: minmax(0, 1fr) minmax(0, 270px) 84px 84px 44px 28px; font-size: 13px; padding-bottom: 6px; }
    .mdl-tree.one { --cols: minmax(0, 1fr) minmax(0, 270px) 90px 44px 28px; }
    .mdl-row {
      display: grid; grid-template-columns: var(--cols); align-items: center; column-gap: 12px;
      min-height: 36px; padding: 0 14px; border-top: 1px solid var(--line-soft);
    }
    .mdl-head { min-height: 32px; border-top: 0; font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
    .mdl-c-name { display: flex; align-items: center; gap: 8px; min-width: 0; padding-left: calc(var(--lvl, 0) * 18px); }
    .mdl-c-status { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; font-size: 11.5px; color: var(--muted); }
    .mdl-c-size, .mdl-c-age { text-align: right; white-space: nowrap; font-size: 12px; font-variant-numeric: tabular-nums; }
    .mdl-c-size.lib { color: var(--lib); }
    .mdl-c-age { color: var(--faint); }
    .mdl-c-go { display: flex; justify-content: flex-end; }
    .mdl-dim { color: var(--faint); }
    .mdl-tree details { margin: 0; }
    .mdl-tree summary { cursor: pointer; list-style: none; }
    .mdl-tree summary::-webkit-details-marker { display: none; }
    .mdl-tree summary:hover, .mdl-tree .mdl-file:hover { background: color-mix(in srgb, var(--line) 26%, transparent); }
    .mdl-tree .tw { width: 12px; flex: none; text-align: center; font-size: 10px; color: var(--muted); }
    .mdl-tree details[open] > summary .tw::before { content: "▾"; }
    .mdl-tree details:not([open]) > summary .tw::before { content: "▸"; }
    .mdl-name { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mdl-file code { font-size: 11.5px; color: color-mix(in srgb, var(--text) 88%, var(--muted)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mdl-nobox { width: 14px; flex: none; }
    .mdl-empty { display: grid; justify-items: center; gap: 8px; padding: 28px 16px; color: var(--muted); text-align: center; }
    .mdl-empty .mini-link { margin-left: 0; }
    @media (max-width: 720px) {
      /* Fixed, not auto: every row is a grid of its own, and auto columns
         would size to each row's numbers and zigzag down the list. */
      .mdl-tree { --cols: minmax(0, 1fr) 86px 86px 28px; }
      .mdl-tree.one { --cols: minmax(0, 1fr) 72px 28px; }
      .mdl-head, .mdl-c-age { display: none; }
      .mdl-c-status { grid-column: 1 / -1; grid-row: 2; padding: 0 0 6px calc(var(--lvl, 0) * 18px + 20px); }
      .mdl-c-status:empty { display: none; }
      .mdl-tree:not(.one) .mdl-c-size.here::before { content: "🏠 "; }
      .mdl-tree:not(.one) .mdl-c-size.lib::before { content: "📚 "; }
    }

    .mdl-used {
      font-size: 10px; padding: 1px 6px; border-radius: 4px; white-space: nowrap;
      background: color-mix(in srgb, #4fc38a 18%, transparent); color: #6fd6a4;
      max-width: 220px; overflow: hidden; text-overflow: ellipsis;
    }
    /* A stopped cell's model: named by a cell, read by none — quieter. */
    .mdl-used.parked { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    /* Freshness: ⇪ means a different file sits under this name on HF; "?"
       means there's nothing to compare against. A match gets NO mark at all:
       a checkmark over every matching file would turn the page into a forest
       of checkmarks, when its job is to show what needs attention. Empty
       space here means "no questions". */
    .mdl-fresh { font-size: 11px; font-weight: 700; line-height: 1; cursor: help; }
    .mdl-fresh.newer { color: #ffb74d; }
    .mdl-fresh.unknown { color: #90a4ae; }
    /* Buttons on a file's row. "Update" is dim: it's a suggestion, not a
       call to action — the decision to replace the weights is the
       operator's. */
    .mdl-mini {
      font-size: 10px; padding: 1px 7px; border-radius: 4px; cursor: pointer;
      border: 1px solid color-mix(in srgb, currentColor 28%, transparent);
      background: transparent; color: var(--muted); white-space: nowrap;
    }
    .mdl-mini:hover:not(:disabled) { color: var(--text); }
    .mdl-mini:disabled { opacity: 0.55; cursor: default; }
    .mdl-mini.apply { color: #ffb74d; border-color: color-mix(in srgb, #ffb74d 45%, transparent); }
    .mdl-mini.prev { color: #90a4ae; }
    /* The progress bar lives ON THE FILE'S ROW, not as a single one for the
       whole page: several downloads can run at once, and one shared
       indicator would erase them into each other. Width is this file's
       share, text is its own bytes. */
    .mdl-dl {
      position: relative; display: inline-flex; align-items: center;
      min-width: 132px; height: 16px; padding: 0 7px; border-radius: 4px;
      font-size: 10px; white-space: nowrap; overflow: hidden;
      border: 1px solid color-mix(in srgb, #4fc3f7 40%, transparent);
      background: color-mix(in srgb, #4fc3f7 8%, transparent);
    }
    .mdl-dl-bar {
      position: absolute; inset: 0 auto 0 0; width: 0;
      background: color-mix(in srgb, #4fc3f7 26%, transparent);
      transition: width 0.4s linear;
    }
    .mdl-dl-text { position: relative; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
    /* Interrupted is NOT running. Frozen percentages in the same colors
       would read as a slow download, so the color and the word are both
       different. */
    .mdl-dl.stalled {
      border-color: color-mix(in srgb, #ef5350 45%, transparent);
      background: color-mix(in srgb, #ef5350 10%, transparent);
    }
    .mdl-dl.stalled .mdl-dl-bar { background: color-mix(in srgb, #ef5350 24%, transparent); }
    /* A move rides the file's own row: the downloads' bar (.mdl-dl) — one look
       for "bytes on their way", either direction — wider for the speed and
       the time left, with Stop right beside it. */
    .mdl-move-bar { min-width: 0; flex: 1 1 auto; }
    .mdl-move-stop { padding: 1px 6px; flex: none; }
    /* ⇢ on every row that can move, at the right edge: quiet until the row is
       under the pointer, so fifty of them do not shout. */
    .mdl-go {
      width: 26px; height: 22px; display: inline-grid; place-items: center;
      font-size: 12px; line-height: 1; padding: 0; border-radius: 6px; cursor: pointer;
      background: transparent; color: var(--move, #4fc3f7); opacity: .35;
      border: 1px solid color-mix(in srgb, #4fc3f7 35%, transparent);
    }
    .mdl-tree .mdl-file:hover .mdl-go, .mdl-tree summary:hover .mdl-go, .mdl-go:focus-visible { opacity: 1; }
    @media (hover: none) { .mdl-go { opacity: .8; } }
    /* A move that left the file here says why, in the warning colour. */
    .mdl-stayed {
      font-size: 10px; color: var(--warn, #e0a03f); cursor: default; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* A folded branch says how far its files are; red while the library holds them up. */
    .mdl-move-branch { font-size: 10px; color: #4fc3f7; white-space: nowrap; }
    .mdl-move-branch.stalled { color: #ef5350; }
    .mdl-moves-sum { font-size: 12px; color: #4fc3f7; cursor: pointer; white-space: nowrap; }
    /* Several libraries: a short list by the ⇢, each with its free space. */
    .mdl-move-menu {
      position: fixed; z-index: 50; display: flex; flex-direction: column; gap: 2px; padding: 4px; min-width: 240px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
    }
    .mdl-move-menu button {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left;
      background: transparent; border: 0; color: var(--text); padding: 6px 8px; border-radius: 6px;
      cursor: pointer; font-size: 12px;
    }
    .mdl-move-menu button:hover, .mdl-move-menu button:focus-visible { background: color-mix(in srgb, #4fc3f7 14%, transparent); }
    .mdl-move-menu .meta { color: var(--muted); font-size: 11px; }
    /* Files in a library: the 📚 says where; a file that is ONLY there is
       dimmer, because it is not on this disk. */
    .mdl-lib { font-size: 10px; color: var(--lib, #b39ddb); white-space: nowrap; cursor: default; }
    /* 🤗 beside a model or author name: to that model on /hf. Quiet until the row is looked at. */
    /* A class of its own: .mdl-hf is the Hugging Face box in the side column and .mdl-hf-link the
       header button, and a tree link that borrowed either name restyled them. The name cell's gap spaces it. */
    .mdl-tree-hf { display: inline-block; align-self: center; padding: 0; line-height: 1; font-size: 12px; text-decoration: none; opacity: .55; flex: none; }
    .mdl-row:hover .mdl-tree-hf, .mdl-tree-hf:focus-visible { opacity: 1; }
    .mdl-kind { font-size: 10px; cursor: default; flex: none; }
    .mdl-file-lib code { opacity: .7; }

    /* ── Stores: state, path, room ─────────────────────────────────────── */
    .mdl-store-path {
      color: var(--muted); font-size: 11px; min-width: 0; max-width: 42ch;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* How FULL the store is, not how empty: a glance answers "is there room"
       without reading two numbers and dividing one by the other. */
    .mdl-store-bar {
      display: block; width: 84px; height: 5px; border-radius: 999px; overflow: hidden;
      background: color-mix(in srgb, var(--line) 80%, transparent);
    }
    .mdl-store-bar i { display: block; height: 100%; background: color-mix(in srgb, var(--accent) 70%, var(--muted)); }
    .mdl-store-bar.low i { background: var(--warn, #e0a03f); }
    .mdl-store-state {
      font-size: 10px; font-weight: 500; padding: 1px 7px; border-radius: 999px; white-space: nowrap; cursor: default;
      border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
    }
    .mdl-store-state.good { color: var(--ok, #4fc38a); }
    .mdl-store-state.warn { color: var(--warn, #e0a03f); }
    .mdl-store-state.bad { color: #ef5350; }
    .mdl-path-edit { display: flex; gap: 8px; align-items: center; min-width: 0; }
    .mdl-path-edit input {
      flex: 1; width: auto; height: 30px; min-width: 0; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px;
      background: var(--field); border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 6px 10px;
    }
    .mdl-path-edit .mini-link { margin-left: 0; }
    .mdl-store-files > summary {
      cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--accent-strong);
    }
    .mdl-store-files > summary::-webkit-details-marker { display: none; }
    .mdl-store-files > summary .tw { width: 10px; font-size: 10px; }
    .mdl-store-files[open] > summary .tw::before { content: "▾"; }

  <script>
  /* Inline ON PURPOSE, and it must stay inline. Every other line of this app
     arrives over its own HTTP request; when one of those never lands, nothing
     runs — no router, no readiness flag, no error handler — and the page shows
     its empty shell forever. This is the only code that is already here.

     Two failures it names. A <script>/<link> that fails outright reports itself
     at once. A load that merely never finishes has nothing to report, so a
     timer settles it: still "loading" after 20s means the boot did not happen.
     Either way data-t-state reaches "error", which is what the contract in
     docs/testability.md promises and could not previously deliver — the code
     that would have set it was the code that failed to arrive. */
  (function () {
    var dead = [], done = false;
    addEventListener("error", function (e) {
      var el = e.target;
      if (el && (el.tagName === "SCRIPT" || el.tagName === "LINK")) {
        dead.push((el.src || el.href || "").replace(location.origin, ""));
        if (/\/js\/main\.js/.test(el.src || "")) fail();
      }
    }, true);
    function fail() {
      if (done || document.body.dataset.tState !== "loading") return;
      done = true;
      var why = dead.length ? "assets did not load: " + dead.join(", ")
                            : "scripts did not initialise";
      document.body.dataset.tState = "error";
      document.body.dataset.tStateDetail = why;
      document.body.setAttribute("aria-busy", "false");
      var b = document.createElement("div");
      b.setAttribute("role", "alert");
      b.setAttribute("data-t", "boot-error");
      b.style.cssText = "position:fixed;inset:0 0 auto 0;z-index:99999;padding:14px 18px;"
        + "background:#3b1d1d;color:#fca5a5;border-bottom:1px solid #7f1d1d;"
        + "font:13px/1.5 ui-monospace,monospace";
      b.textContent = "This page did not finish loading — " + why + ". ";
      var r = document.createElement("button");
      r.textContent = "Reload";
      r.style.cssText = "margin-left:10px;padding:3px 10px;cursor:pointer;"
        + "background:#7f1d1d;color:#fee2e2;border:1px solid #b91c1c;border-radius:4px";
      r.onclick = function () { location.reload(); };
      b.appendChild(r);
      document.body.appendChild(b);
    }
    setTimeout(fail, 20000);
  })();
  </script>
