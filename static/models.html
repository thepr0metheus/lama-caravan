<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Models — Lama Caravan</title>
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/topology-board.css">
  <link rel="stylesheet" href="/css/canvas.css">
  <link rel="stylesheet" href="/css/modals.css">
  <link rel="stylesheet" href="/css/cards.css">
  <link rel="stylesheet" href="/css/form.css">
  <link rel="stylesheet" href="/css/monitor.css">
  <link rel="stylesheet" href="/css/nodes.css">
  <link rel="stylesheet" href="/css/onboarding.css">
  <style>
    body {
      min-height: 100dvh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui, system-ui, sans-serif);
      display: flex;
      flex-direction: column;
    }
    .topbar { position: sticky; top: 0; z-index: 30; }
    .sys-back {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--surface); color: var(--text); text-decoration: none;
      font-size: 12px; white-space: nowrap;
      transition: border-color .15s ease;
    }
    .sys-back:hover { border-color: var(--accent); }

    .mdl-wrap {
      width: min(980px, 94vw);
      margin: 0 auto;
      padding: 22px 0 60px;
      display: flex; flex-direction: column; gap: 16px; flex: 1;
    }
    .mdl-hero {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 18px; flex-wrap: wrap; padding: 22px 24px;
      border: 1px solid var(--line); border-radius: 16px;
      background:
        radial-gradient(1200px 300px at 8% -40%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
        var(--surface);
    }
    .mdl-hero h1 { margin: 0 0 4px; font-size: 26px; display: flex; align-items: center; gap: 10px; }
    .mdl-hero p { margin: 0; font-size: 12.5px; color: var(--muted); max-width: 52ch; }
    .mdl-hero-stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px; min-width: min(460px, 100%);
    }
    .mdl-stat {
      border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px;
      background: color-mix(in srgb, var(--bg) 55%, transparent);
      display: flex; flex-direction: column; gap: 2px; min-width: 0;
    }
    .mdl-stat span { font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
    .mdl-stat strong { font-size: 13.5px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mdl-stat.warn strong { color: var(--warn, #e0a03f); }
    .mdl-stat.good strong { color: var(--ok, #4fc38a); }

    .mdl-panel {
      border: 1px solid var(--line); border-radius: 16px;
      padding: 16px 18px; background: var(--surface);
      display: flex; flex-direction: column; gap: 10px;
    }
    .mdl-panel-head { display: flex; align-items: center; gap: 10px; }
    .mdl-panel-head .mdl-path { color: var(--muted); font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mdl-path-edit { display: flex; gap: 8px; align-items: center; }
    .mdl-path-edit input { flex: 1; min-width: 0; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px;
      background: var(--field); border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 6px 10px; }
    .mdl-tree { overflow: auto; font-size: 12.5px; }
    .mdl-tree details { margin: 2px 0; }
    .mdl-tree summary {
      cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px;
      padding: 5px 8px; border-radius: 8px;
    }
    .mdl-tree summary::-webkit-details-marker { display: none; }
    .mdl-tree summary:hover { background: color-mix(in srgb, var(--line) 30%, transparent); }
    .mdl-tree summary .tw { width: 12px; color: var(--muted); flex: 0 0 auto; }
    .mdl-tree details[open] > summary .tw::before { content: "▾"; }
    .mdl-tree details:not([open]) > summary .tw::before { content: "▸"; }
    .mdl-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mdl-size { margin-left: auto; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
    .mdl-lvl { margin-left: 18px; border-left: 1px solid color-mix(in srgb, var(--line) 60%, transparent); padding-left: 8px; }
    .mdl-file { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 26px; border-radius: 8px; }
    .mdl-file:hover { background: color-mix(in srgb, var(--line) 24%, transparent); }
    .mdl-file code { font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mdl-file .meta { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .mdl-used {
      font-size: 10px; padding: 1px 6px; border-radius: 4px; white-space: nowrap;
      background: color-mix(in srgb, #4fc38a 18%, transparent); color: #6fd6a4;
      max-width: 220px; overflow: hidden; text-overflow: ellipsis;
    }
    .mdl-file input[type=checkbox] { accent-color: var(--accent); }
    .mdl-foot { display: flex; align-items: center; gap: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
    .mdl-foot .picked { color: var(--muted); font-size: 12px; margin-right: auto; }
    .mdl-del {
      background: color-mix(in srgb, #e05555 22%, var(--surface));
      border: 1px solid #8a3030; color: #f2b8b5;
      border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px;
    }
    .mdl-del:disabled { opacity: .5; cursor: default; }
    .mdl-hf-link { text-decoration: none; }
  </style>
</head>
<body data-t-state="loading" aria-busy="true">
  <script>
  /* Inline ON PURPOSE, and it must stay inline. Every other line of this app
     arrives over its own HTTP request; when one of those never lands, nothing
     runs — no router, no readiness flag, no error handler — and the page shows
     its empty shell forever. This is the only code that is already here.

     Two failures it names. A <script>/<link> that fails outright reports itself
     at once. A load that merely never finishes has nothing to report, so a
     timer settles it: still "loading" after 20s means the boot did not happen.
     Either way data-t-state reaches "error", which is what the contract in
     docs/testability.md promises and could not previously deliver — the code
     that would have set it was the code that failed to arrive. */
  (function () {
    var dead = [], done = false;
    addEventListener("error", function (e) {
      var el = e.target;
      if (el && (el.tagName === "SCRIPT" || el.tagName === "LINK")) {
        dead.push((el.src || el.href || "").replace(location.origin, ""));
        if (/\/js\/main\.js/.test(el.src || "")) fail();
      }
    }, true);
    function fail() {
      if (done || document.body.dataset.tState !== "loading") return;
      done = true;
      var why = dead.length ? "assets did not load: " + dead.join(", ")
                            : "scripts did not initialise";
      document.body.dataset.tState = "error";
      document.body.dataset.tStateDetail = why;
      document.body.setAttribute("aria-busy", "false");
      var b = document.createElement("div");
      b.setAttribute("role", "alert");
      b.setAttribute("data-t", "boot-error");
      b.style.cssText = "position:fixed;inset:0 0 auto 0;z-index:99999;padding:14px 18px;"
        + "background:#3b1d1d;color:#fca5a5;border-bottom:1px solid #7f1d1d;"
        + "font:13px/1.5 ui-monospace,monospace";
      b.textContent = "This page did not finish loading — " + why + ". ";
      var r = document.createElement("button");
      r.textContent = "Reload";
      r.style.cssText = "margin-left:10px;padding:3px 10px;cursor:pointer;"
        + "background:#7f1d1d;color:#fee2e2;border:1px solid #b91c1c;border-radius:4px";
      r.onclick = function () { location.reload(); };
      b.appendChild(r);
      document.body.appendChild(b);
    }
    setTimeout(fail, 20000);
  })();
  </script>
  <header class="topbar" data-t="header">
    <div class="topbar-brand">
      <h1 class="brand-title">
        <img src="/favicon.svg?v=2" alt="" aria-hidden="true">
        <span class="brand-name-wrap">
          <span data-i18n="appTitle" data-t="header-app-title">LAMA CARAVAN</span>
          <span class="brand-acronym" data-i18n="modelsPage" data-t="header-page-subtitle">Models on disk</span>
        </span>
      </h1>
    </div>
    <div class="actions">
      <a class="sys-back" href="/"><span aria-hidden="true">←</span> <span data-i18n="sysBackToBoard">Board</span></a>
      <a class="sys-back mdl-hf-link" href="/hf">🤗 HF</a>
      <div class="user-chip" id="userChip" hidden data-t="header-user-chip">
        <button id="userChipBtn" type="button" aria-haspopup="menu" aria-expanded="false" data-t="header-user-menu-open">
          <span class="user-chip-ico">👤</span><span id="userChipName" data-t="header-user-name"></span><span class="lang-caret" aria-hidden="true">▾</span>
        </button>
        <div id="userMenu" class="user-menu" hidden data-t="header-user-menu">
          <button id="userMenuLogout" type="button" data-i18n="authLogout" data-t="header-user-logout">Log out</button>
        </div>
      </div>
      <div class="lang-select" id="langSelect">
        <button id="langTrigger" class="lang-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" data-i18n-aria="a11yInterfaceLanguage" aria-label="Interface language" data-t="header-lang-open">
          <span class="lang-emoji" id="langTriggerEmoji">☕</span>
          <span class="lang-code" id="langTriggerCode" data-t="header-lang-current">EN</span>
          <span class="lang-caret" aria-hidden="true">▾</span>
        </button>
        <ul class="lang-menu" id="langMenu" role="listbox" tabindex="-1" hidden data-t="header-lang-menu" data-i18n-aria="a11yInterfaceLanguage" aria-label="Interface language"></ul>
      </div>
    </div>
  </header>

  <div class="mdl-wrap">
    <section class="mdl-hero">
      <div>
        <h1><span aria-hidden="true">📦</span> <span data-i18n="modelsPage">Models on disk</span></h1>
        <p data-i18n="modelsPageSub">Everything the controller can serve — sizes, which cells use what, and cleanup of the rest.</p>
      </div>
      <div class="mdl-hero-stats" id="mdlHeroStats" data-t="models-hero-stats"></div>
    </section>

    <section class="mdl-panel">
      <div class="mdl-panel-head">
        <span class="mdl-path" id="mdlPath" data-t="models-path-value"></span>
        <button class="mini-link" type="button" id="mdlPathEdit" title="Edit models directory" data-t="models-path-edit">✎</button>
        <button class="mini-link" type="button" id="mdlSelectAll" data-i18n="gcSelectAll" data-t="models-unused-select-all">Select all unused</button>
      </div>
      <div class="mdl-path-edit" id="mdlPathEditRow" hidden data-t="models-path-edit-row">
        <input id="mdlPathInput" placeholder="/path/to/models" autocomplete="off" spellcheck="false"
               data-i18n-aria="a11yModelsDirectory" aria-label="Models directory" data-t="models-path-input">
        <button class="mini-link" type="button" id="mdlPathSave" data-i18n="save" data-t="models-path-save">Save</button>
        <button class="mini-link" type="button" id="mdlPathCancel" data-i18n="cancel" data-t="models-path-cancel">Cancel</button>
      </div>
      <div class="mdl-tree" id="mdlTree" data-t="models-tree"><p class="muted">…</p></div>
      <div class="mdl-foot">
        <span class="picked" id="mdlPicked" data-t="models-picked-summary"></span>
        <button class="mdl-del" id="mdlDelete" disabled data-i18n="gcDelete" data-t="models-delete-selected">Delete selected</button>
      </div>
    </section>
  </div>

  <div id="confirmOverlay" class="modal-overlay" hidden data-t="confirm-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" data-tone="danger">
      <header class="dlg-head">
        <span class="dlg-ico" aria-hidden="true"></span>
        <h2 id="confirmTitle" data-i18n="deleteBackup" data-t="confirm-title">Delete?</h2>
      </header>
      <p id="confirmText" data-t="confirm-text"></p>
      <div id="confirmMeta" class="modal-meta" hidden data-t="confirm-meta"></div>
      <code id="confirmPath" data-t="confirm-path"></code>
      <input id="confirmInput" type="text" autocomplete="off" spellcheck="false" hidden
             aria-labelledby="confirmTitle" data-t="confirm-input">
      <div class="modal-actions">
        <button id="confirmCancel" type="button" data-i18n="cancel" data-t="confirm-cancel">Cancel</button>
        <button id="confirmDelete" type="button" class="danger" data-i18n="deleteAction" data-t="confirm-accept">Delete</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status" data-t="app-toast"></div>
  <script type="module" src="/js/models-page.js"></script>
</body>
</html>
