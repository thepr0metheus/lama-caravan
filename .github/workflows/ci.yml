          python3 scripts/check_context_window.py
          python3 scripts/test_context_window.py
          python3 scripts/test_cell_requests.py
          python3 scripts/test_driver_outlook.py
          python3 scripts/test_route_windows.py
          python3 scripts/test_output_health.py
          python3 scripts/test_usage_reserve.py
          python3 scripts/test_subscription_usage.py
          python3 scripts/test_pools.py
          python3 scripts/test_board_providers.py
          python3 scripts/test_pool_steps.py
          python3 scripts/test_proxy_heartbeat.py
          python3 scripts/test_proxy_journal.py
          python3 scripts/test_subscription_resets.py
          python3 scripts/test_pool_forward.py
          python3 scripts/test_incidents.py
          python3 scripts/test_model_card.py
          python3 scripts/test_cell_crash.py
          python3 scripts/test_gpu_driver.py
