name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: py_compile (whole tree)
        run: python3 -m py_compile $(git ls-files '*.py')

      # The records a scout report and the operator write, and how the board
      # reads them: hosts and clients apart, the scout pull off the request
      # path. Auto-provisioning, which this step was first written for, is gone
      # (2026-09-24); the port it minted is made by hand now.
      - name: host and client records
        run: |
          set -e
          python3 scripts/test_engine_cell_server.py
          python3 scripts/test_install_llama_lock.py
          # The history of a machine's token speed records what a cell does now, not the rates it holds (1.3.590).

      # These were one `run:` scalar with the second line indented under it,
      # which YAML folds into ONE command — so check_messages_i18n.py has been
      # riding along as argv to check_tour_i18n.py and never actually ran.
      - name: i18n coverage
        run: |
          set -e
          # check_messages_i18n stands aside on a host without node, so that its
          # absence reads as "not checked here" rather than as a traceback. That
          # is only safe while SOMEBODY checks: this runner is that somebody, so
          # a runner that lost node must fail loudly instead of skipping it for
          # every locale at once.
          node --version
          python3 scripts/check_tour_i18n.py
          python3 scripts/check_messages_i18n.py
          python3 scripts/check_i18n_calls.py
          python3 scripts/check_cell_form_text.py
          python3 scripts/test_i18n_untranslated.py

      # docs/testability.md publishes the data-t names as a contract the E2E
      # suite locates by. A rename that skips the doc reads to that suite as
      # "the tests broke by themselves".
      - name: testability contract
        run: |
          set -e
          python3 scripts/testability_names.py --check
          python3 scripts/check_boot_guard.py
          # The bar of every page is one template (scripts/gen_header.py), the way back to the main board in it.
          python3 scripts/check_header.py
          python3 scripts/check_typed_machine_actions.py
          # A field with no tab is a field the config search can name but never
          # point at — indistinguishable, to the operator, from one that is not
          # there at all.
          python3 scripts/check_field_homes.py
          python3 scripts/check_runner_model_fields.py
          # What a request carries is named in one place: the journal and the entry read the same fact (docs/vision-describe.md).
          python3 scripts/check_media_parts.py
          # What a wired reader is, said in one place, and never read out of a model's name (docs/vision-describe.md).
          python3 scripts/check_media_reader.py
          # Routing's reader block says the answer the rule gave; a state it invented is the fact read a second way.
          python3 scripts/check_media_reader_board.py
          # The board's reader reads a picture for the row that cannot, one way, and only a picture sent inside the request.
          python3 scripts/check_media_reading.py
          # What each diagram in diagrams/ says about a rule, and the guard it still points at.
          python3 scripts/check_diagrams.py
          python3 scripts/check_installer_assets.py
          python3 scripts/check_cell_python_floor.py
          python3 scripts/check_cell_self_capture.py
          python3 scripts/check_shell_pipes.py
          python3 scripts/check_llama_flags.py
          # A default cell's number must be readable back out of the sentence it came from.
          python3 scripts/check_model_defaults.py
          python3 scripts/check_board_401.py
          python3 scripts/check_cell_kinds.py
          python3 scripts/check_cell_forms.py
          python3 scripts/check_cell_listen.py
          python3 scripts/check_proxy_id_namespace.py
          python3 scripts/check_same_tab_links.py
          python3 scripts/test_same_tab_links.py
          python3 scripts/check_board_live_patch.py
          python3 scripts/check_static_modules.py
          # Every node a test starts goes through scripts/_node.py, so that it gets --single-threaded:
          # node could hang for good in process.exit (2026-10-21).
          python3 scripts/check_node_start.py
          # Every Rust test binary cargo starts goes through scripts/rust_test_runner.py: a time limit, and nothing left running
          # once the run that started it is gone (2026-11-04: an abandoned `cargo test` spun a Mac for three days).
          python3 scripts/check_rust_test_start.py
          python3 scripts/test_rust_test_runner.py
          python3 scripts/check_ui_tokens.py
          python3 scripts/check_oop_contract.py
          python3 scripts/check_rust_contract.py
          python3 scripts/test_rust_conformance.py
          python3 scripts/test_rust_scout_conformance.py
          python3 scripts/test_scout_install.py
          python3 scripts/test_rust_admin_conformance.py
          python3 scripts/test_rust_alone.py
          python3 scripts/test_rust_whole.py
          python3 scripts/check_oauth_owner.py
          python3 scripts/check_subscription_resets.py
          python3 scripts/check_models_dir_source.py
          python3 scripts/check_api_spec.py
          python3 scripts/check_public_leaks.py
          python3 scripts/check_context_window.py
          # What an Anthropic answer says it used, whole, and the table that prices the cache (1.3.585).
          python3 scripts/test_metrics_default.py
          python3 scripts/test_model_freshness.py
          python3 scripts/test_model_jobs.py
          python3 scripts/test_draft_file.py
          python3 scripts/test_hf_checkpoint_layout.py
          python3 scripts/test_ports.py
          python3 scripts/test_frozen_answers.py
          # A promise file keeps a day the program quoted as it was written: the scout's comparison went red the day after its snapshot (2026-11-04).
          python3 scripts/check_frozen_day_words.py
          # A promise file keeps a value the program read from the internet: 75 answers went red on 2026-11-06 when npm published a newer version than the snapshot's.
          python3 scripts/check_conformance_offline.py
          python3 scripts/test_api_body.py
          python3 scripts/test_js_model_meta.py
          python3 scripts/test_js_usage_stats.py
          python3 scripts/test_js_credit_left.py
          python3 scripts/test_js_money.py
          # Whether a cell's line breathes or holds a speed: the class, the builder and the live patch read one table (1.3.588).
          python3 scripts/test_js_cell_speed.py
          python3 scripts/test_js_cell_speed_live.py
          python3 scripts/test_js_client_llama_update.py
          python3 scripts/test_js_start_strip.py
          python3 scripts/test_js_memory.py
          # How fast a model can answer from where its weights lie: the owner's two measurements on the 3090 (2026-11-03).
          python3 scripts/test_js_decode_speed.py
          python3 scripts/test_js_ram_plan.py
          # A machine's model cache on its card: the setting, the figures, the foreign files (1.3.576).
          python3 scripts/test_js_model_cache.py
          python3 scripts/test_js_model_disk.py
          python3 scripts/test_js_cell_note.py
          python3 scripts/test_js_cell_memory.py
          # What a cell holds, written again on every tick from the report, as the builder draws it (2026-11-07).
          python3 scripts/test_js_cell_memory_live.py
          python3 scripts/test_js_split_mode.py
          # Where a llama.cpp cell's model lives: the cards and RAM as llama.cpp's fitting splits them, and what holds it (1.3.616).
          python3 scripts/test_js_placement.py
          # What a llama.cpp cell takes — its cache, its buffers, its weights — from the form or a stored config, one rule (1.3.635).
          python3 scripts/test_js_cell_plan.py
          # What a model on /models does and how long a context its weights were trained with (1.3.637).
          python3 scripts/test_js_model_facts.py
          # The new-cell wizard: what for and which model, how it runs, where and the settings (1.3.638).
          python3 scripts/test_js_add_model.py
          python3 scripts/test_js_card_fold.py
          python3 scripts/test_js_card_rows.py
          python3 scripts/test_js_cell_window.py
          python3 scripts/test_js_library_path.py
          python3 scripts/test_js_model_queue.py
          python3 scripts/test_js_client_name.py
          python3 scripts/test_js_cell_log.py
          python3 scripts/test_js_cell_chat.py
          python3 scripts/test_js_cell_settings.py
          python3 scripts/test_js_ui_parts.py
          python3 scripts/test_js_ui_menus.py
          python3 scripts/test_js_machine_head.py
          # The list of models under a machine's cells: rows, launches, marks (the owner's choice М1).
          python3 scripts/test_js_machine_models.py
          python3 scripts/test_js_machine_plan.py
          python3 scripts/test_js_machine_build.py
          python3 scripts/test_stand.py
          python3 scripts/test_js_command_preview.py
          python3 scripts/test_js_form.py
          python3 scripts/test_js_topology_activity.py
          python3 scripts/test_js_topology_nodes.py
          python3 scripts/test_js_llama_edit.py
          python3 scripts/test_js_cell_previews.py
          python3 scripts/test_js_remote_cells.py
          python3 scripts/test_js_kv_cache.py
          python3 scripts/test_js_asked_window.py
          python3 scripts/test_js_scout_add.py
          python3 scripts/test_js_scout_release.py
          python3 scripts/test_js_suspect_banner.py
          python3 scripts/test_js_client_proxies.py
          python3 scripts/test_js_routers.py
          python3 scripts/test_js_consumer_access.py
          python3 scripts/test_js_output_cells.py
          python3 scripts/test_js_cloud.py
          python3 scripts/test_js_pools.py
          python3 scripts/test_js_provider_glances.py
          python3 scripts/test_js_pool_board.py
          python3 scripts/test_js_pool_reveal.py
          python3 scripts/test_js_step_carry.py
          python3 scripts/test_js_subscription_resets.py
          python3 scripts/test_js_server_order.py
          python3 scripts/test_js_board_view.py
          python3 scripts/test_js_dialogs.py
          python3 scripts/test_confirm_typed_css.py
          python3 scripts/test_toast_css.py
          python3 scripts/test_place_words_css.py
          python3 scripts/test_js_dialog_llamas.py
          python3 scripts/test_js_topology_modals.py
          python3 scripts/test_js_charts.py
          python3 scripts/test_js_cables.py
          python3 scripts/test_js_cable_flow.py
          # Routing's reader block: its words are the answers `Reader::word()` gives, run against
          # contract/media_reader_board.json with the real module in node.
          python3 scripts/test_js_reader_block.py
          python3 scripts/test_js_history.py
          python3 scripts/test_js_favorites.py
          python3 scripts/test_js_config_locator.py
          python3 scripts/test_js_system_panels.py
          python3 scripts/test_js_models_page.py
          python3 scripts/test_js_model_stores.py
          python3 scripts/test_js_model_moves.py
          python3 scripts/test_js_system_page.py
          python3 scripts/test_js_hf_catalog.py
          python3 scripts/test_js_hf_repo_view.py
          python3 scripts/test_js_hf_bench.py
          python3 scripts/test_js_hf_downloads.py
          python3 scripts/test_js_hf_page.py
          python3 scripts/test_js_polling.py
          python3 scripts/test_js_utils.py
          python3 scripts/test_js_i18n.py
          python3 scripts/test_js_river.py
          python3 scripts/test_js_river_minnow.py
          python3 scripts/test_js_river_trout.py
          python3 scripts/test_js_river_frogs.py
          python3 scripts/test_js_onboarding.py
          python3 scripts/test_js_onboarding_tours.py
          python3 scripts/test_js_main.py
          python3 scripts/test_js_topology_dnd.py
          python3 scripts/test_js_data_modules.py
          python3 scripts/test_js_canvas.py
          python3 scripts/test_js_topology_render.py
          python3 scripts/test_js_model_list.py
          python3 scripts/check_firewall_untouched.py
          python3 scripts/check_image_contents.py
          # One delivery at a time: every way into a delivery holds the lock of deploy/nas/release_ship.py.
          python3 scripts/check_delivery_lock.py
          # What a delivery says of its scout: the content the controller hands a release by (fleet/scout_follow.rs).
          python3 scripts/test_release_ship_scout.py
          python3 scripts/check_container_answers.py
          python3 scripts/test_week_windows.py
          python3 scripts/test_js_model_schedule.py
          python3 scripts/test_js_consumers.py
          python3 scripts/check_ci_coverage.py
          python3 scripts/check_test_ports.py
          python3 scripts/check_command_mirrors.py
          python3 scripts/test_nas_lockdown.py
          python3 scripts/test_nas_models_library.py
          python3 scripts/test_header_model_pages.py
          python3 scripts/test_js_header_machines.py
          python3 scripts/test_board_heads.py
          python3 scripts/test_routing_titles.py
          python3 scripts/test_header.py
          python3 scripts/test_routing_cards_css.py
          python3 scripts/test_boot_guard.py
          python3 scripts/test_routing_dock_css.py
          python3 scripts/test_columns_scroll_css.py
          python3 scripts/test_board_cards_fit_css.py
          python3 scripts/test_css_machine_glance.py
          python3 scripts/test_cell_strip_css.py
          python3 scripts/test_cell_settings_css.py
          python3 scripts/test_cables_css.py
          # Every page fits a phone: the bar folds where it does not fit, the main board folds into one column (2026-11-07).
          python3 scripts/test_pages_fit_phone_css.py
          # The input dot is a handle, and what already has the pool is no landing (1.3.587).
          python3 scripts/test_pull_css.py
          # Only a chosen path makes the rest of Routing step back: pointing at a card only lights it (1.3.676).
          python3 scripts/test_path_dim_css.py
          # The star on a cell: kept with its slot, said with the topology, set by one route (1.3.680).
          python3 scripts/test_js_model_rating.py
          # The breathing is the busy switch's only, and a held speed is quiet (1.3.588).
          python3 scripts/test_cell_speed_css.py
          # The Strata runner (1.3.512): its command, the files a scout
          # brings, and the launcher against a stand-in Strata.
          # What a cell keeps in its machine's memory, for the form's RAM scale (1.3.574).
          # A machine's model cache as its scout reports it, and the two calls the board makes of it (1.3.576).
          python3 scripts/test_css_model_cache.py
          # The GR00T runner and its cell: a robot policy behind HTTP (the SpiderMonkey task).
          python3 scripts/test_gr00t_server.py
          python3 scripts/test_strata_launch.py
          python3 scripts/test_cell_servers.py
          # The cells' one reader of a recording (1.3.610): WAV itself, the rest through ffmpeg (a stand-in here).
          python3 scripts/test_cell_recording.py
          # The voice-clone cell (1.3.611): OpenAI's speech request, the voices kept on the machine, and the
          # controller's own requests to it over HTTP.
          python3 scripts/test_tts_server.py
          # The voice-clone runner (1.3.611): XTTS-v2, CosyVoice2 and F5-TTS on the runner row, one engine a cell.
          # The live talk with a cell (1.3.612): its own WebSocket passed on behind the board, byte for byte.
          # The live window over a cell (1.3.612): MiniCPM-o's talk both ways, full duplex and turn by turn.
          python3 scripts/test_js_voice_live.py
          # The page a cell serves itself (1.3.613): one form of its https address, at the save and on the card's 🌐.
          python3 scripts/test_cell_page.py
          python3 scripts/test_cell_form.py
          # The voice servers (1.3.551 cells, 1.3.553 runners): LFM2.5-Audio's cell server, the launchers of the
          # voice engines against stand-in uv, git and venv python, and the five runners on the runner row.
          python3 scripts/test_lfm_audio_server.py
          python3 scripts/test_voice_launchers.py
          python3 scripts/test_inferssd_launcher.py
          # The voice window (1.3.606): the controller asks a running cell what its runner answers, and the
          # board's window records a wav, keeps the talk and shows the answer's time.
          python3 scripts/test_js_voice_talk.py
          python3 scripts/check_cell_health_contract.py
          # Правило, потерявшее и код и ссылку, — потерянный инцидент.
          python3 scripts/check_why_refs.py
          # A changelog entry is a file of changelog.d/, one per merge request, never the top of CHANGELOG.md.
          python3 scripts/check_changelog_fragments.py
          python3 scripts/test_changelog.py
          # The shared clone's tidy: only what is merged, clean and left alone goes (Papyrus gitlab-code-tidy).
          python3 scripts/test_tidy_git.py
          # Every guard above must be able to fail. Two were found in one day
          # that could not, both reporting green while the thing they guard was
          # deleted.
          python3 scripts/check_undefined_names.py
          # tests/golden/ is a photograph of one operator's fleet and is never
          # mirrored, so the public tree has no snapshots to compare against.
          # Skip there, out loud; in a tree that has the directory the test
          # stays as strict as before (missing snapshots are a failure).
          python3 scripts/test_guards_fail.py

      - name: JS syntax (ES modules)
        run: |
          set -e
          for f in $(git ls-files 'static/js/*.js' 'static/*.js'); do
            cp "$f" /tmp/check.mjs
            node --check /tmp/check.mjs || { echo "FAIL $f"; exit 1; }
          done

      # The controller of this tree starts and answers what a fresh one answers:
      # closed before the first account (be41edff, 2026-10-07), open to it after.
      # Its own data folder and port, stopped on every way out — the step it
      # replaces asked a fresh controller for /api/state, took the 401 for a
      # broken boot and was red from that day; its `app.py &` was never stopped.
      - name: boot smoke (admin serves)
        run: python3 scripts/check_boot_smoke.py
