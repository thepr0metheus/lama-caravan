# LAMA CARAVAN controller in Docker: the quickest way to try the project.
#
#   TZ=Europe/Berlin LLAMA_TOPOLOGY_SERVER_IP=<this machine's address> docker compose up -d --build
#   open http://<this machine>:7990
#
# The first page makes the first account. Then attach the machines that serve models: ＋ Add scout on the board.
services:
  caravan:
    build:
      context: .
      # Names the commit on the board; harmless to omit:
      #   CARAVAN_GIT_HEAD=$(git rev-parse --short HEAD) docker compose up -d --build
      args:
        CARAVAN_GIT_HEAD: "${CARAVAN_GIT_HEAD:-}"
    image: lama-caravan:latest
    container_name: lama-caravan
    # The scout it hands out is built for Linux on x86_64: on another machine this builds and runs under emulation.
    platform: linux/amd64
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "7990:7990"     # the board
      - "23999:23999"   # the entry for keys; one moved on the board needs its port here
    volumes:
      # Everything mutable: settings, accounts, journals, downloaded models.
      - caravan-data:/data
    environment:
      # Both are required: the container can guess neither, and it refuses to start without them.
      # The controller's time zone: every schedule runs by it.
      TZ: "${TZ:?set TZ to this controller's time zone, e.g. TZ=Europe/Berlin}"
      # The address clients and scouts reach this controller at.
      LLAMA_TOPOLOGY_SERVER_IP: "${LLAMA_TOPOLOGY_SERVER_IP:?set it to this machine's LAN address}"
      HOME: /data

volumes:
  caravan-data:
